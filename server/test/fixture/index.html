<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture — Home</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fafafa; }
  header { position: sticky; top: 0; background: #1e3a5f; color: #fff; padding: 14px 24px; display: flex; gap: 24px; align-items: center; }
  header a { color: #fff; text-decoration: none; }
  main { max-width: 760px; margin: 32px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
  .tall { height: 1800px; background: linear-gradient(#fff, #dde); border-radius: 8px; }
  button { padding: 8px 14px; font-size: 15px; }
  #status { margin-left: 12px; color: #1a7f37; font-weight: 600; }
</style>
</head>
<body>
<header>
  <a href="/" id="brand"><strong>Fixture Site</strong></a>
  <nav>
    <a href="/">Home</a>
    <a href="/page2.html" id="to-page2">Second page</a>
  </nav>
</header>
<main>
  <h1>A page to walk through</h1>
  <p>This exists so evo.videostroll's tests never touch the network: a heading, a nav, a form, a button, and a long block to scroll.</p>
  <div class="card">
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" placeholder="Type here">
    <button id="greet" type="button" onclick="document.getElementById('status').textContent='Hello, '+document.getElementById('name').value+'!'">Greet</button>
    <span id="status" aria-live="polite"></span>
  </div>
  <div class="card">
    <h2 id="below">Further down</h2>
    <p>Scroll target.</p>
  </div>
  <div class="tall" aria-hidden="true"></div>
  <p id="bottom">The bottom of the page.</p>
</main>
</body>
</html>
